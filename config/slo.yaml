service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  error_budget: 201.6 minutes per 28d window
  note: "99.5% requests must complete successfully within 3000 ms. The remaining 0.5% of a 28-day window is 201.6 minutes of error budget; errors and slow requests consume it. The 3000 ms threshold matches the latency dashboard SLO line."
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
