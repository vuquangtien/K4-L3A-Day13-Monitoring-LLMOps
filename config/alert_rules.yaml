alerts:
  - name: high_request_error_rate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: '#day13-llmops-alerts'
    owner: LLMOps on-call
    runbook: docs/alerts.md#alert-1-high-request-error-rate
  - name: latency_slo_breach
    severity: warning
    condition: latency_p95_ms > 3000
    duration: 10m
    type: symptom-based
    channel: '#day13-llmops-alerts'
    owner: LLMOps on-call
    runbook: docs/alerts.md#alert-2-latency-slo-breach
  - name: retrieval_success_degradation
    severity: warning
    condition: retrieval_success_rate_pct < 90
    duration: 5m
    type: symptom-based
    channel: '#day13-llmops-alerts'
    owner: Retrieval service owner
    runbook: docs/alerts.md#alert-3-retrieval-success-degradation
